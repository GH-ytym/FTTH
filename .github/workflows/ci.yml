name: CI

on:
  push:
  pull_request:
    branches: [main]

# A newer push to the same ref supersedes a running check; this repository is
# private, so macOS (10x) and Windows (2x) minutes count against the quota.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check
      - name: Tests
        run: uv run pytest -q
      - name: CLI smoke
        run: |
          uv run ftth --version
          uv run ftth config show
